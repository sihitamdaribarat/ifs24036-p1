<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Pendaftaran</title>
</head>
<body>

    <!-- Landmark Navigasi -->
    <nav aria-label="Navigasi Utama">
        <a href="index.html">Home</a> | 
        <a href="blog.html">Blog</a> | 
        <a href="blog-detail.html">Detail Blog</a> | 
        <a href="form.html">Form</a> | 
        <a href="cv.html">CV</a>
    </nav>

    <hr>

    <!-- Landmark Konten Utama -->
    <main>
        <h1>Pendaftaran Akun</h1>
        
        <form>
            <fieldset>
                <legend>Data Diri</legend>

                <p>
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" name="nama" id="nama" required>
                </p>

                <fieldset>
                    <legend>Jenis Kelamin:</legend>
                    <input type="radio" name="jk" value="laki-laki" id="laki">
                    <label for="laki">Laki-Laki</label>
                    
                    <input type="radio" name="jk" value="perempuan" id="perempuan">
                    <label for="perempuan">Perempuan</label>
                </fieldset>

                <p>
                    <label for="tempat_lahir">Tempat Lahir:</label>
                    <input type="text" name="tempat_lahir" id="tempat_lahir">
                </p>

                <p>
                    <label for="tanggal_lahir">Tanggal Lahir:</label>
                    <input type="date" name="tanggal_lahir" id="tanggal_lahir">
                </p>

                <p>
                    <label for="agama">Agama:</label>
                    <select name="agama" id="agama">
                        <option value="">--- Pilih Agama ---</option>
                        <option value="islam">Islam</option>
                        <option value="katolik">Katolik</option>
                        <option value="protestan">Protestan</option>
                        <option value="hindu">Hindu</option>
                        <option value="buddha">Buddha</option>
                        <option value="konghucu">Konghucu</option>
                    </select>
                </p>

                <fieldset>
                    <legend>Hobi:</legend>
                    <input type="checkbox" name="hobi" value="olahraga" id="hobi_olahraga">
                    <label for="hobi_olahraga">Olahraga</label>
                    
                    <input type="checkbox" name="hobi" value="membaca" id="hobi_membaca">
                    <label for="hobi_membaca">Membaca</label>
                    
                    <input type="checkbox" name="hobi" value="ngoding" id="hobi_ngoding">
                    <label for="hobi_ngoding">Ngoding</label>
                </fieldset>

                <p>
                    <label for="password">Password:</label>
                    <input type="password" name="password" id="password" required>
                </p>

                <p>
                    <input type="checkbox" name="setuju" id="setuju" required>
                    <label for="setuju">Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.</label>
                </p>

                <p>
                    <button type="reset">Reset</button>
                    <button type="submit">Submit</button>
                </p>

            </fieldset>
        </form>
    </main>

</body>
</html>
